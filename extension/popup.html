<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Memory</title>
  <style>
    body {
      width: 360px;
      max-height: 480px;
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: #111;
      color: #eee;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #eee;
      font-size: 14px;
    }
    #results {
      margin-top: 10px;
      max-height: 400px;
      overflow-y: auto;
    }
    .result {
      padding: 8px 6px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .result:hover { background: #1a1a1a; }
    .result-title { font-size: 13px; font-weight: 600; }
    .result-meta { font-size: 11px; color: #888; margin-top: 2px; }
    .result-snippet { font-size: 12px; color: #bbb; margin-top: 4px; }
    .empty { color: #666; font-size: 12px; padding: 20px 6px; text-align: center; }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Search what you've read..." autofocus />
  <div id="results"><div class="empty">Start typing to search your browsing memory</div></div>
  <script src="popup.js"></script>
</body>
</html>
