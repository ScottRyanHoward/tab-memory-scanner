<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Memory</title>
  <style>
    body {
      width: 380px;
      max-height: 520px;
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: #111;
      color: #eee;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .topbar .brand { font-size: 12px; color: #777; }
    .topbar a { font-size: 12px; color: #8ab4ff; text-decoration: none; cursor: pointer; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 11px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #eee;
      font-size: 14px;
    }
    #answer {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    #sources { margin-top: 12px; }
    #sources .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
    .source {
      padding: 6px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 12px;
    }
    .source:hover { background: #1a1a1a; }
    .source .idx { color: #8ab4ff; font-weight: 600; margin-right: 4px; }
    .source .host { color: #888; }
    .empty { color: #666; font-size: 12px; padding: 16px 6px; text-align: center; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Tab Memory</span>
    <a id="settings-link">⚙ Settings</a>
  </div>
  <input id="ask" type="text" placeholder="Ask about your history… (press Enter)" autofocus />
  <div id="answer"><div class="empty">Ask a question about the pages you've read.</div></div>
  <div id="sources"></div>
  <script src="popup.js"></script>
</body>
</html>
