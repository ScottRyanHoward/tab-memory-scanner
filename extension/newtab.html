<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Memory</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      margin: 0;
      background: #0d0d0d;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12vh;
      min-height: 100vh;
    }
    h1 { font-weight: 500; font-size: 20px; color: #aaa; margin-bottom: 20px; }
    input {
      width: 560px;
      max-width: 80vw;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #eee;
      font-size: 16px;
    }
    #results {
      width: 560px;
      max-width: 80vw;
      margin-top: 20px;
    }
    .result {
      padding: 12px 10px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .result:hover { background: #161616; }
    .result-title { font-size: 15px; font-weight: 600; }
    .result-meta { font-size: 12px; color: #888; margin-top: 3px; }
    .result-snippet { font-size: 13px; color: #bbb; margin-top: 6px; }
    .empty { color: #555; font-size: 13px; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>What are you looking for?</h1>
  <input id="search" type="text" placeholder="Search everything you've read..." autofocus />
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
